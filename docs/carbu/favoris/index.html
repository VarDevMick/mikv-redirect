    <title>Carbu Live</title>
    <!-- Installable sur l'écran d'accueil (PWA). Chemins en /carbu/ : site publié sur mikv.io/carbu. -->
    <link rel="manifest" href="/carbu/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/carbu/icons/apple-touch-icon.png?v=5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background: #0e1116;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      .boot { flex: 1; display: flex; flex-direction: column; gap: 18px; align-items: center; justify-content: center; background: #0e1116;
        font-family: Overpass, -apple-system, system-ui, sans-serif; }
      .boot-name { color: #f2f4f7; font-size: 34px; font-weight: 900; letter-spacing: -0.5px; }
      .boot-name span { color: #7fa8f0; font-weight: 400; }
      .boot-track { position: relative; width: 120px; height: 4px; border-radius: 2px; background: #1e232b; overflow: hidden; }
      .boot-track i { position: absolute; top: 0; bottom: 0; width: 35%; border-radius: 2px; background: #2563c9;
        animation: boot-bar 1.2s ease-in-out infinite; }
      .boot-dot { animation: boot-blink 1.2s ease-in-out infinite; }
      @keyframes boot-bar { from { left: -35%; } to { left: 100%; } }
      @keyframes boot-blink { 50% { opacity: 0.25; } }
      /* Sur mobile, 100 % passe sous la barre du navigateur : hauteur réellement visible. */
      @supports (height: 100dvh) {
        html,
        body {
          height: 100dvh;
        }
      }
    </style>
    <script>
      // Invite d'installation de Chrome (Android) : gardée pour le bouton « Installer » de l'app.
      window.__carbuInstall = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__carbuInstall = e;
        window.dispatchEvent(new Event('carbu-installable'));
      });
      window.addEventListener('appinstalled', function () {
        window.__carbuInstall = null;
        window.dispatchEvent(new Event('carbu-installed'));
      });
    </script>

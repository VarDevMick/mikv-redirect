    <title>Carbu Live</title>
    <!-- Installable sur l'écran d'accueil (PWA). Chemins en /carbu/ : site publié sur mikv.io/carbu. -->
    <link rel="manifest" href="/carbu/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/carbu/icons/apple-touch-icon.png?v=5" />
    <meta name="theme-color" content="#F3F4F6" />
    <script>
      // Thème avant tout dessin (clair par défaut ; « Sombre », ou « Auto » avec un téléphone en sombre) :
      // évite un écran de démarrage noir puis blanc. L'app reprend la main ensuite (ThemeGate).
      try {
        var p = JSON.parse(localStorage.getItem('carbu.prefs.v1') || '{}') || {};
        var t = (p.themeDefault || 0) < 2 && p.theme === 'auto' ? 'light' : p.theme;
        var d = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (d) {
          document.documentElement.className = 'dark';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0E1116');
        }
      } catch (e) {}
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Carbu" />
    <style id="expo-reset">
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f3f4f6;
      }
      html.dark,
      html.dark body {
        background: #0e1116;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Écran de démarrage : affiché par-dessus l'app jusqu'à l'arrivée de la carte (retiré par l'app). */
      #boot { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; gap: 18px;
        align-items: center; justify-content: center; background: #f3f4f6; transition: opacity 0.25s ease;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      #boot.boot-out { opacity: 0; pointer-events: none; }
      #boot svg { display: block; flex-shrink: 0; }
      html.dark #boot { background: #0e1116; }
      html.dark .boot-name { color: #f2f4f7; }
      html.dark .boot-name span { color: #7fa8f0; }
      html.dark .boot-msg { color: #8a93a3; }
      .boot-name { color: #0e1116; font-size: 34px; line-height: 40px; height: 40px; font-weight: 900; letter-spacing: -0.5px; }
      .boot-name span { color: #1f5bb8; font-weight: 400; }
      .boot-msg { height: 20px; line-height: 20px; font-size: 15px; color: #5b6575; }
      /* 1. Le panneau s'allume : le liseré blanc se trace (0,6 s) */
      .boot-sign { stroke-dasharray: 100; stroke-dashoffset: 100; animation: boot-draw 0.6s ease-out forwards; }
      @keyframes boot-draw { to { stroke-dashoffset: 0; } }
      /* 2. Puis le point vert « en direct » s'allume et pulse */
      .boot-dot { opacity: 0; animation: boot-on 0.2s 0.6s forwards, boot-blink 1.2s 0.8s ease-in-out infinite; }
      @keyframes boot-on { to { opacity: 1; } }
      @keyframes boot-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
      /* 3. Et la pompe se remplit puis se vide doucement (carburant jaune, surface en vague), tant que ça charge */
      .boot-level { transform: translateY(16.5px); animation: boot-level 3.2s 0.6s cubic-bezier(.45,0,.55,1) infinite; }
      @keyframes boot-level { 0% { transform: translateY(16.5px); } 45%, 60% { transform: translateY(2.4px); } 100% { transform: translateY(16.5px); } }
      .boot-wave { animation: boot-wave 1.1s linear infinite; }
      @keyframes boot-wave { to { transform: translateX(-6px); } }
      @media (prefers-reduced-motion: reduce) {
        .boot-sign { animation: none; stroke-dashoffset: 0; }
        .boot-dot { animation: none; opacity: 1; }
        .boot-level, .boot-wave { animation: none; }
      }
      /* Sur mobile, 100 % passe sous la barre du navigateur : hauteur réellement visible. */
      @supports (height: 100dvh) {
        html,
        body {
          height: 100dvh;
        }
      }
    </style>
    <script>
      // Remise à zéro : https://mikv.io/carbu/?reset efface les réglages (carburants, carte, trajet,
      // premier lancement, cache des temps) et relance l'app comme au premier jour.
      if (/[?&]reset\b/.test(location.search)) {
        try { localStorage.clear(); sessionStorage.clear(); } catch (e) {}
        location.replace(location.pathname);
      }
    </script>
    <script>
      // Invite d'installation de Chrome (Android) : gardée pour le bouton « Installer » de l'app.
      window.__carbuInstall = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__carbuInstall = e;
        window.dispatchEvent(new Event('carbu-installable'));
      });
      window.addEventListener('appinstalled', function () {
        window.__carbuInstall = null;
        window.dispatchEvent(new Event('carbu-installed'));
      });
    </script>

        <rect width="48" height="48" rx="11" fill="#1f5bb8"/>

        <g transform="translate(8.6 7.4) scale(1.32)">
          <path d="M5.5 3h7A1.5 1.5 0 0 1 14 4.5V19H4V4.5A1.5 1.5 0 0 1 5.5 3z" fill="#fff"/>
          <g clip-path="url(#boot-tank)"><g class="boot-level">
            <path class="boot-wave" d="M-2 2.2q1.5-1 3 0t3 0t3 0t3 0t3 0t3 0t3 0t3 0V20H-2Z" fill="#f5c84b"/>
          </g></g>
          <rect x="6.3" y="5.3" width="5.4" height="4.2" rx="0.8" fill="#0b0d11"/>
          <circle class="boot-dot" cx="9" cy="7.4" r="1.25" fill="#7ee0a8"/>
          <rect x="2.8" y="18.6" width="12.4" height="2.6" rx="1.1" fill="#fff"/>
          <path d="M14 8.5h1.6a1.6 1.6 0 0 1 1.6 1.6v6.2a1.4 1.4 0 0 0 2.8 0V8.2L17.6 5.8" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </svg>
      <div class="boot-name">carbu<span> live</span></div>
      <div class="boot-msg" id="boot-msg"></div>

    <div id="root"></div>
    <script>
      // Filet de sécurité : si l'app ne démarre pas, on ne reste pas bloqué sur l'écran de démarrage.
      setTimeout(function () { var b = document.getElementById('boot'); if (b) b.classList.add('boot-out'); }, 20000);
    </script>

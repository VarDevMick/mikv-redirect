<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Carbu Live</title>
    <!-- Installable sur l'écran d'accueil (PWA). Chemins en /carbu/ : site publié sur mikv.io/carbu. -->
    <link rel="manifest" href="/carbu/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/carbu/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Carbu" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background: #0f1b23;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      .boot { flex: 1; display: flex; align-items: center; justify-content: center; background: #0f1b23; }
      .boot-totem { width: 200px; border-radius: 18px; background: #1d5b79; padding: 14px; box-sizing: border-box;
        display: flex; flex-direction: column; gap: 12px; font-family: "Arial Narrow", "Roboto Condensed", system-ui, sans-serif; }
      .boot-title { color: #fff; font-size: 36px; font-weight: 900; letter-spacing: 2px; text-align: center; }
      .boot-panel { height: 84px; border-radius: 8px; background: #050709; display: flex; align-items: center; justify-content: center; }
      .boot-panel span { color: #f4f7fa; font-size: 54px; font-weight: 800; letter-spacing: 4px;
        text-shadow: 0 0 14px rgba(200, 225, 255, 0.45); animation: boot-blink 1.2s ease-in-out infinite; }
      .boot-track { position: relative; height: 14px; border-radius: 5px; background: #2f7bb0; overflow: hidden; }
      .boot-track i { position: absolute; top: 0; bottom: 0; width: 35%; border-radius: 5px; background: #f4f7fa; opacity: 0.85;
        animation: boot-bar 1.2s ease-in-out infinite; }
      @keyframes boot-bar { from { left: -35%; } to { left: 100%; } }
      @keyframes boot-blink { 50% { opacity: 0.55; } }
      /* Sur mobile, 100 % passe sous la barre du navigateur : hauteur réellement visible. */
      @supports (height: 100dvh) {
        html,
        body {
          height: 100dvh;
        }
      }
    </style>
    <script>
      // Invite d'installation de Chrome (Android) : gardée pour le bouton « Installer » de l'app.
      window.__carbuInstall = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__carbuInstall = e;
        window.dispatchEvent(new Event('carbu-installable'));
      });
      window.addEventListener('appinstalled', function () {
        window.__carbuInstall = null;
        window.dispatchEvent(new Event('carbu-installed'));
      });
    </script>

    <div id="root">
      <!-- Écran de démarrage, remplacé par l'app dès qu'elle est chargée (même dessin que Splash.tsx). -->
      <div class="boot" role="progressbar" aria-label="Carbu Live, chargement">
        <div class="boot-totem">
          <div class="boot-title">CARBU</div>
          <div class="boot-panel"><span>LIVE</span></div>
          <div class="boot-track"><i></i></div>
        </div>
      </div>
    </div>
